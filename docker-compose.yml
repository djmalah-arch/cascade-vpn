# Cascade VPN — entry server (RU). Everything runs in containers; state lives in ./data (see install.sh).
name: geovpn

x-log: &log
  logging:
    driver: json-file
    options: { max-size: 20m, max-file: "3" }

services:
  # ---------------------------------------------------------------- Remnawave panel (users, subscriptions, xray nodes)
  remnawave-db:
    mem_limit: 384m
    pids_limit: 128
    # every image is pinned (version tag + digest): a rebuild/pull never brings an untested version.
    # Update deliberately: change the digest here, test, commit.
    image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
    container_name: remnawave-db
    restart: always
    shm_size: 256mb
    env_file: ./data/remnawave.env
    environment: [TZ=UTC]
    volumes: [remnawave-db-data:/var/lib/postgresql]
    networks: [remnawave]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"], interval: 3s, timeout: 10s, retries: 20 }
    <<: *log

  remnawave-redis:
    mem_limit: 128m
    pids_limit: 64
    image: valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    container_name: remnawave-redis
    restart: always
    command: >
      valkey-server --save "" --appendonly no --maxmemory-policy noeviction --loglevel warning
      --unixsocket /var/run/valkey/valkey.sock --unixsocketperm 777 --port 0
    volumes: [valkey-socket:/var/run/valkey]
    networks: [remnawave]
    healthcheck: { test: ["CMD", "valkey-cli", "-s", "/var/run/valkey/valkey.sock", "ping"], interval: 3s, timeout: 3s, retries: 20 }
    <<: *log

  remnawave:
    mem_limit: 640m
    pids_limit: 256
    healthcheck: { test: ["CMD", "node", "-e", "require('http').get({host:'127.0.0.1',port:3000,path:'/api/auth/status',headers:{'X-Forwarded-Proto':'https','X-Forwarded-For':'127.0.0.1'}},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"], interval: 30s, timeout: 10s, retries: 3, start_period: 90s }
    image: ${REMNAWAVE_IMAGE:-remnawave/backend:3.4.4@sha256:63ef481550bbf49dabfa514c95d94109619cc85607730b308f7ad0b9b5599f06}
    container_name: remnawave
    restart: always
    env_file: ./data/remnawave.env
    volumes: [valkey-socket:/var/run/valkey]
    ports: ["127.0.0.1:3000:3000"]
    networks: [remnawave]
    ulimits: { nofile: { soft: 1048576, hard: 1048576 } }
    depends_on:
      remnawave-db: { condition: service_healthy }
      remnawave-redis: { condition: service_healthy }
    <<: *log

  # ---------------------------------------------------------------- web: portal, personal pages, subscriptions, panel
  # listens only on 127.0.0.1:8443 (behind Reality on :443, PROXY protocol) and :80 (ACME + redirect)
  caddy:
    mem_limit: 128m
    pids_limit: 128
    healthcheck: { test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"], interval: 30s, timeout: 5s, retries: 3 }
    image: caddy:2.11.4@sha256:0c994536bddb66445885237f1a5dcc1916bccea922661c76b4e9fc24061f9b52
    container_name: geovpn-caddy
    restart: always
    network_mode: host
    volumes:
      - ./data/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./config/public:/srv/public:ro
      - ./data/public-run:/run/geovpn-public:ro
    <<: *log

  # ---------------------------------------------------------------- xray (Reality + Hysteria2 on :443), managed by the panel
  remnanode:
    mem_limit: 384m
    pids_limit: 256
    healthcheck: { test: ["CMD-SHELL", "pidof rw-core >/dev/null && pidof rw-node >/dev/null"], interval: 30s, timeout: 5s, retries: 3, start_period: 120s }
    image: ${NODE_IMAGE:-remnawave/node@sha256:0cdf386dd49f360fc885bb34bde21132e478e40f0deac62d616086ec0fa9257e}
    container_name: remnanode
    restart: always
    network_mode: host
    cap_add: [NET_ADMIN]
    env_file:
      - { path: ./data/portal/node.env, required: false }   # written by bootstrap
    ulimits: { nofile: { soft: 1048576, hard: 1048576 } }
    volumes:
      - ./data/caddy/caddy/certificates/acme-v02.api.letsencrypt.org-directory:/var/lib/remnawave/configs/xray/ssl:ro
    <<: *log

  # ---------------------------------------------------------------- AmneziaWG 2.0 (userspace) + bridge into xray
  awg:
    init: true
    mem_limit: 192m
    pids_limit: 128
    healthcheck: { test: ["CMD", "awg", "show", "awg0"], interval: 30s, timeout: 5s, retries: 3, start_period: 60s }
    build: ./images/awg
    image: geovpn/awg
    container_name: geovpn-awg
    restart: always
    network_mode: host
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun]
    volumes:
      - ./data/awg:/etc/amnezia/amneziawg
      - awg-run:/var/run/amneziawg
    <<: *log

  singbox:
    mem_limit: 128m
    pids_limit: 128
    healthcheck: { test: ["CMD-SHELL", "pidof sing-box >/dev/null"], interval: 30s, timeout: 5s, retries: 3 }
    image: ${SINGBOX_IMAGE:-ghcr.io/sagernet/sing-box:v1.14.2@sha256:afbffd294c5eb3519cc7b4587299ef189bb0a2ca2f667cb6301fdb6b9bce9558}
    container_name: geovpn-singbox
    restart: always
    network_mode: host
    cap_add: [NET_ADMIN]
    command: ["run", "-c", "/etc/sing-box/config.json"]
    volumes: [./config/sing-box.json:/etc/sing-box/config.json:ro]
    <<: *log

  # ---------------------------------------------------------------- DPI bypass for YouTube (IPv4)
  zapret:
    init: true
    mem_limit: 64m
    pids_limit: 64
    healthcheck: { test: ["CMD-SHELL", "pidof nfqws >/dev/null"], interval: 30s, timeout: 5s, retries: 3 }
    build: ./images/zapret
    image: geovpn/zapret
    container_name: geovpn-zapret
    restart: always
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW]
    volumes: [./data/zapret:/opt/zapret/config.d]
    <<: *log

  # ---------------------------------------------------------------- Telegram proxy
  mtproxy:
    init: true
    mem_limit: 128m
    pids_limit: 128
    healthcheck: { test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9189/',timeout=3).read(1)"], interval: 30s, timeout: 5s, retries: 3 }
    build: ./images/mtproxy
    image: geovpn/mtproxy
    container_name: geovpn-mtproxy
    restart: always
    network_mode: host
    volumes: [./data/mtproxy:/etc/geovpn/mtproxy:ro]
    <<: *log

  # ---------------------------------------------------------------- portal (admin, pages, balancer watchdog, backups...)
  public:
    init: true
    mem_limit: 128m
    pids_limit: 128
    healthcheck: { test: ["CMD", "python", "-c", "import socket; s=socket.socket(socket.AF_UNIX); s.settimeout(3); s.connect('/run/geovpn-public/http.sock'); s.close()"], interval: 30s, timeout: 5s, retries: 3, start_period: 60s }
    image: geovpn/portal
    build: { context: ., dockerfile: portal/Dockerfile, args: { SOURCE_COMMIT: "${SOURCE_COMMIT:-untracked}" } }
    container_name: geovpn-public
    restart: always
    network_mode: none
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      - GEOVPN_ROLE=public
      - GEOVPN_PUBLIC_DIR=/public
      - GEOVPN_PUBLIC_SOCKET=/run/geovpn-public/http.sock
    volumes:
      - ./data/public:/public:ro
      - ./data/public-run:/run/geovpn-public
      - ./data/apps:/opt/geovpn-portal/app:ro
    <<: *log

  portal:
    init: true
    mem_limit: 384m
    pids_limit: 256
    healthcheck: { test: ["CMD", "python", "/app/health.py"], interval: 30s, timeout: 10s, retries: 3, start_period: 180s }
    build: { context: ., dockerfile: portal/Dockerfile, args: { SOURCE_COMMIT: "${SOURCE_COMMIT:-untracked}" } }
    image: geovpn/portal
    container_name: geovpn-portal
    restart: always
    network_mode: host
    cap_add: [NET_ADMIN]
    environment:
      - GEOVPN_DATA=/data
      - GEOVPN_PUBLIC_DIR=/public-state
      - GEOVPN_PROJECT_DATA=/host-data
      - NODE_IMAGE=${NODE_IMAGE:-remnawave/node@sha256:0cdf386dd49f360fc885bb34bde21132e478e40f0deac62d616086ec0fa9257e}
      - CADDY_DATA=/caddy-data
      - NODE_GW=172.28.0.1
    volumes:
      - ./data/portal:/data
      - ./data/public:/public-state
      - ./data:/host-data:ro
      - ./data/awg:/etc/amnezia/amneziawg
      - awg-run:/var/run/amneziawg
      - ./data/mtproxy:/etc/geovpn/mtproxy
      - ./data/apps:/opt/geovpn-portal/app
      - ./data/caddy:/caddy-data:ro
      - /var/run/docker.sock:/var/run/docker.sock
    <<: *log

volumes:
  remnawave-db-data:
  valkey-socket:
  awg-run:

networks:
  remnawave:
    name: remnawave-network
    enable_ipv6: true
    ipam:
      config:
        - { subnet: 172.28.0.0/16, gateway: 172.28.0.1 }
        - { subnet: "fd00:5eed:2::/64" }
